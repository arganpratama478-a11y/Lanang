  @keyframes jalan{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

  .card{background:rgba(15,15,20,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:28px;padding:32px 24px;max-width:420px;width:100%;margin-top:40px;position:relative;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  .footer{margin-top:22px;font-size:12px;color:#aaa}

<script>
  // SALJU SLOW - santai aja
  const canvas = document.getElementById('salju');
  const ctx = canvas.getContext('2d');
  let W, H, flakes = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  // Cuma 60 butir, biar ga rame
  for(let i=0;i<60;i++){
    flakes.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*2.5 + 1,      // ukuran kecil
      s: Math.random()*0.25 + 0.15,  // SPEED SLOW BANGET 0.15 - 0.4
      o: Math.random()*0.5 + 0.3,    // transparan lembut
      sway: Math.random()*0.3,       // goyang dikit aja
      phase: Math.random()*Math.PI*2
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = 'white';
    flakes.forEach(f=>{
      ctx.globalAlpha = f.o;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
      f.y += f.s;
      // goyang kiri-kanan pelan
      f.phase += 0.005;
      f.x += Math.sin(f.phase) * f.sway * 0.3;
      if(f.y > H + 5){ f.y = -5; f.x = Math.random()*W; }
    });
    requestAnimationFrame(draw);
  }
  draw();

  document.querySelector('.foto').addEventListener('click', () => {
    alert("🗿 Udah dibilang nikmatin aja");
  });
</script>
